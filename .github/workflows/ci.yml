name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full verification test suite
        run: pytest -v

      - name: Build pure-Python OrcaSlicer plugin wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m build --wheel
          python -c "
          import zipfile, glob
          wheels = glob.glob('dist/orca_x3g-*-py3-none-any.whl')
          assert len(wheels) == 1, f'Expected 1 wheel, found {wheels}'
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              assert any(n.endswith('.dist-info/METADATA') for n in names)
              assert any(n.endswith('.dist-info/WHEEL') for n in names)
              assert any(n.endswith('.dist-info/RECORD') for n in names)
              for n in names:
                  low = n.lower()
                  for kw in ('conf', 'secret', 'cert'):
                      assert kw not in low, f'Audit-forbidden keyword {kw} in {n}'
          print('Verified wheel:', wheels[0])
          "

      - name: Upload OrcaSlicer plugin wheel artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: orca-x3g-wheel
          path: dist/orca_x3g-*.whl
